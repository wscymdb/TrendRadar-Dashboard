app:
  timezone: Asia/Shanghai
  show_version_update: true
schedule:
  enabled: false
  preset: morning_evening
platforms:
  enabled: true
  api_url: ''
  sources:
  - id: toutiao
    name: 今日头条
    expected_domain: toutiao.com
    enabled: true
  - id: baidu
    name: 百度热搜
    expected_domain: baidu.com
    enabled: true
  - id: wallstreetcn-hot
    name: 华尔街见闻
    expected_domain: wallstreetcn.com
    enabled: true
  - id: thepaper
    name: 澎湃新闻
    expected_domain: thepaper.cn
    enabled: true
  - id: bilibili-hot-search
    name: bilibili 热搜
    expected_domain: bilibili.com
    enabled: true
  - id: cls-hot
    name: 财联社热门
    expected_domain: cls.cn
    enabled: true
  - id: ifeng
    name: 凤凰网
    expected_domain: ifeng.com
    enabled: true
  - id: tieba
    name: 贴吧
    expected_domain: baidu.com
    enabled: true
  - id: weibo
    name: 微博
    expected_domain: weibo.com
    enabled: true
  - id: douyin
    name: 抖音
    expected_domain: douyin.com
    enabled: true
  - id: zhihu
    name: 知乎
    expected_domain: zhihu.com
    enabled: true
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1
  feeds:
  - id: hacker-news
    name: Hacker News
    url: https://hnrss.org/frontpage
    enabled: true
    max_age_days: 1
  - id: ruanyifeng
    name: 阮一峰的网络日志
    url: http://www.ruanyifeng.com/blog/atom.xml
    enabled: false
    max_age_days: 1
  - id: yahoo-finance
    name: 雅虎财经
    url: https://finance.yahoo.com/news/rssindex
    enabled: true
    max_age_days: 1
report:
  mode: current
  display_mode: keyword
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 0
filter:
  method: keyword
  priority_sort_enabled: true
ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.7
  reclassify_threshold: 0.6
  prompt_file: prompt.txt
  extract_prompt_file: extract_prompt.txt
  update_tags_prompt_file: update_tags_prompt.txt
display:
  region_order:
  - new_items
  - hotlist
  - rss
  - standalone
  - ai_analysis
  regions:
    hotlist: true
    new_items: false
    rss: true
    standalone: false
    ai_analysis: true
  standalone:
    platforms:
    - zhihu
    - wallstreetcn-hot
    rss_feeds: []
    max_items: 20
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ''
    dingtalk:
      webhook_url: https://oapi.dingtalk.com/robot/send?access_token=c4572df32d6ef282b78712773eb59808029163764cbad89e25626cda451dde1b
    wework:
      webhook_url: ''
      msg_type: markdown
    telegram:
      bot_token: ''
      chat_id: ''
    email:
      from: ''
      password: ''
      to: ''
      smtp_server: ''
      smtp_port: ''
    ntfy:
      server_url: https://ntfy.sh
      topic: ''
      token: ''
    bark:
      url: ''
    slack:
      webhook_url: ''
    generic_webhook:
      webhook_url: ''
      payload_template: ''
storage:
  backend: auto
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: output
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ''
    bucket_name: ''
    access_key_id: ''
    secret_access_key: ''
    region: ''
  pull:
    enabled: false
    days: 7
  max_news_capacity: 500
  data_retention_days: 7
  auto_cleanup_enabled: true
ai:
  model: deepseek/deepseek-chat
  api_key: ''
  api_base: ''
  timeout: 120
  temperature: 1.0
  max_tokens: 5000
  num_retries: 1
  fallback_models: []
ai_analysis:
  enabled: false
  language: Chinese
  prompt_file: ai_analysis_prompt.txt
  mode: follow_report
  max_news_for_analysis: 150
  include_rss: false
  include_standalone: true
  include_rank_timeline: true
ai_translation:
  enabled: true
  language: 中文
  prompt_file: ai_translation_prompt.txt
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: false
    rss: true
    standalone: true
advanced:
  debug: false
  version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version
  mcp_version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp
  configs_version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: http://127.0.0.1:10801
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ''
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: ━━━━━━━━━━━━━━━━
